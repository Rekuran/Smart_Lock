version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: iot-smartlock-broker
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    ports:
      - "127.0.0.1:1883:1883" # Bound to localhost only for local development
    restart: unless-stopped
