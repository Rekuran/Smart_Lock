# Mosquitto Insecure Configuration for Phase 1
# This configuration allows anonymous access and no encryption for research purposes.

# Listen on port 1883 on all interfaces within the container
listener 1883 0.0.0.0

# Allow anonymous connections (no username/password required)
allow_anonymous true

# Persistence (Disabled for simplicity in Phase 1)
persistence false

# Logging to stdout
log_dest stdout
log_type all
